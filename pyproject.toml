[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vn-alpr-lab"
version = "0.1.0"
description = "Vietnamese license-plate detection and OCR benchmark for Colab training and Jetson evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6",
  "Pillow>=10",
  "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
