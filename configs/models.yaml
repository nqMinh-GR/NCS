    resolution_policy: spatial_size_configurable
    preprocessing: letterbox_rgb_imagenet
    code_license: Apache-2.0
    weights_license: Apache-2.0
    upstream_terms: "Student checkpoint published by the authors. Training used a DINOv3 ViT-B/16 teacher. Default fine-tune strips teacher_model and sets loss_distill to 0 so the teacher weights are not downloaded. Redistributing the student weights should keep the DINOv3 license notice."
