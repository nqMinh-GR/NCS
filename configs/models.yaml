# Model registry. checked_at 2026-10-26.
# reference_* fields are upstream tables. They are not this project's leaderboard.
checked_at: "2026-10-26"
plate_class: license_plate

# Names that may be mapped to the primary plate class. Numeric ids and
# artifact names are never mapped by default.
plate_name_aliases:
  - license_plate
  - licence_plate
  - license
  - plate
  - bien_so
  - bien_so_xe
  - number_plate
  - licenseplate

artifact_class_names: ["images", "labels", "image", "label"]

